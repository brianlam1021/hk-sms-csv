<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="輸入最多四個字，畫成一塊虛構港式紙皮石門牌，存圖轉發。此門牌屬虛構，不可當真實地址或門牌使用。"
    />
    <meta name="theme-color" content="#1c1914" />
    <title>四字紙皮 — 虛構紙皮石門牌</title>
    <link rel="canonical" href="https://brianlam1021.github.io/hk-sms-csv/sizi-cipi/" />
    <meta property="og:title" content="四字紙皮 — 虛構紙皮石門牌" />
    <meta
      property="og:description"
      content="輸入最多四個字，畫成一塊虛構港式紙皮石門牌，存圖轉發。此門牌屬虛構，不可當真實地址或門牌使用。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brianlam1021.github.io/hk-sms-csv/sizi-cipi/" />
    <meta name="robots" content="index,follow" />
    <script type="module" crossorigin src="./assets/index-CFCy_xmS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CswMmf72.css">
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">紙皮石 · 虛構門牌</p>
        <h1>四字紙皮</h1>
        <p class="lead">
          輸入心情或狀態，最多四個字。頁面畫成一塊虛構港式紙皮石門牌，存圖即可轉發。
        </p>
      </header>

      <aside class="warn" role="note">
        <strong>此門牌屬虛構。</strong>
        請勿填入真實地址、樓棟或門號。亦不可把產出的圖當成真實地址或門牌使用。
      </aside>

      <form class="composer" id="composer" autocomplete="off">
        <label class="field" for="phrase">
          <span class="field-label">
            <span>心情或狀態</span>
            <span id="count" aria-live="polite">0 / 4</span>
          </span>
          <input
            id="phrase"
            name="phrase"
            type="text"
            inputmode="text"
            maxlength="8"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            placeholder="例如：今日好悶"
          />
        </label>

        <p class="examples-label">試呢幾句</p>
        <div class="examples" id="examples">
          <button type="button" data-phrase="今日好悶">今日好悶</button>
          <button type="button" data-phrase="收工先算">收工先算</button>
          <button type="button" data-phrase="暫時失聯">暫時失聯</button>
          <button type="button" data-phrase="星期一病">星期一病</button>
        </div>
      </form>

      <section class="stage is-empty" id="stage" aria-label="門牌預覽">
        <canvas id="plate" width="1600" height="1000" aria-label="虛構紙皮石門牌"></canvas>
        <p class="empty-hint" id="empty-hint">打一至四個字，就會出牌</p>
      </section>

      <button type="button" class="save" id="save" disabled>
        存圖
      </button>
      <p class="save-hint" id="save-hint">未有字之前唔可以存。</p>

      <p class="fineprint">
        本頁唔會上載你打嘅字，亦無帳戶、廣告或追蹤。圖只存在你部機。
        砌法係瀏覽器即場畫嘅水泥嵌磚，不是拼豆圖或地址產生器。
      </p>
      <p class="back-link"><a href="../">← 短訊記帳CSV</a></p>
    </main>
  </body>
</html>
